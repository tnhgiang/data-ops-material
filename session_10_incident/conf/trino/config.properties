# Single-node setup: this node acts as both coordinator and worker
# coordinator: receives queries, builds execution plan, distributes to workers
coordinator=true
# Allow coordinator to also execute worker tasks (single-node only)
# Set to false in production so coordinator handles only query planning
node-scheduler.include-coordinator=true
# Port Trino listens on inside the container
http-server.http.port=8080
# Workers register themselves here; points to self in single-node mode
discovery.uri=http://localhost:8080
