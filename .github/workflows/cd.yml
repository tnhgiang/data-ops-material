name: DataOps CD

on:
  workflow_run:
    workflows: ["DataOps CI"]
    types: [completed]
    branches: [main, "feat/*"]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted
    steps:
      - name: Pull latest code
        run: git -C ${{ vars.REPO_PATH }} pull origin main

      - name: Verify DAG loaded
        run: |
          sleep 10
          curl -f -u "airflow:airflow" \
            http://localhost:8080/api/v1/dags/session_08_order_pipeline \
            | python3 -c "import sys, json; d=json.load(sys.stdin); assert d['is_active'], 'DAG not active'"
